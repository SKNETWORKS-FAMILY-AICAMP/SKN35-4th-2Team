# /etc/nginx/sites-available/codeclue  (복사 후 sites-enabled에 링크. 순서는 docs/DEPLOY_AWS.md)
# 80번 포트로 들어온 요청을 gunicorn(127.0.0.1:8000)에 전달한다.

server {
    listen 80 default_server;
    server_name _;   # 도메인이 생기면 그 이름으로 바꾼다

    client_max_body_size 32m;   # 이미지 업로드 한도 (한 장 10MB x 3장 + 여유). 서버(Django)가 장당 10MB를 다시 검사한다

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 답변이 한 글자씩 나타나게 하는 설정 (이게 없으면 답변이 모였다가 한꺼번에 나온다)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;   # 답변 생성이 오래 걸려도 끊지 않는다
        proxy_send_timeout 300s;
    }
}
